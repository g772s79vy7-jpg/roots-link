<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROOTS LINK</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#edf3ff;font:15px system-ui,sans-serif}header,main{max-width:1250px;margin:auto;padding:14px}h1{margin:0;color:#ffd36a}button,select,input{padding:9px;border-radius:9px;border:1px solid #52627a;background:#26364d;color:#fff}button{cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.active{background:#ffd36a;color:#172033}nav,.tools,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.panel,.zone{background:#1c293b;border:1px solid #40516b;border-radius:13px;padding:13px;margin:10px 0}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:10px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px;margin-top:12px}.card{background:#2a3b53;border:1px solid #61758f;border-radius:10px;padding:10px;min-height:125px;cursor:pointer}.card h3{font-size:14px;margin:0 0 7px}.stats{color:#ffd36a;font-weight:bold}.desc,.small{font-size:12px;color:#bdc9da}.meta{margin-top:7px;font-size:11px;color:#a9c4e7}.decklist{max-height:480px;overflow:auto}.item{display:flex;justify-content:space-between;align-items:center;padding:6px;background:#111c2b;border-radius:7px;margin:5px 0;font-size:12px}.hidden{display:none}.battle{display:grid;grid-template-columns:1fr 1fr;gap:9px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.unit{padding:9px;background:#314862;border:1px solid #7186a0;border-radius:8px;font-size:12px;cursor:pointer;min-height:90px}.unit.selected{outline:3px solid #ffd36a}.hand{display:flex;gap:7px;overflow:auto}.hand .card{min-width:150px}.log{height:160px;overflow:auto;background:#0b1220;padding:8px;border-radius:8px;font-size:12px;line-height:1.65}.hp{font-size:21px;color:#ff9c9c;font-weight:bold}.pill{display:inline-block;background:#172337;border-radius:20px;padding:2px 7px;margin:2px;font-size:11px}.unit small{color:#d0def0}.muted{opacity:.65}.good{color:#9de6b2}.warn{color:#ffd36a}@media(max-width:750px){.layout,.battle{grid-template-columns:1fr}.board{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card[data-id],.card[data-hand]{position:relative;display:grid;grid-template-rows:auto 1fr auto;min-height:108px}
.card[data-id]{grid-template-columns:1fr auto;align-items:start}
.card .card-detail{font-size:14px;min-height:36px;padding:4px 8px;grid-column:2;grid-row:1}
.card .desc,.card .meta,.card .stats{grid-column:1/-1}
dialog{width:min(90vw,440px);color:#edf3ff;background:#1c293b;border:1px solid #52627a;border-radius:14px;padding:20px}
dialog::backdrop{background:#050a12bb}
.piece-ports{letter-spacing:.08em;overflow-wrap:anywhere}
@media(max-width:540px){.card .card-detail{font-size:13px}dialog{max-height:80dvh;overflow:auto}}
.card.jigsaw,.unit.jigsaw{position:relative;isolation:isolate;background:transparent;border-color:transparent;padding:16px 18px}
.jigsaw::before,.jigsaw::after{content:"";position:absolute;inset:0;z-index:-2;clip-path:var(--piece-shape);background:var(--root-color,#8293b1);pointer-events:none}
.jigsaw::after{inset:2px;background:#253650;z-index:-1}
.jigsaw.selected::after{background:#394960}
.jigsaw.selected::before{background:#ffd36a}
.jigsaw .piece-ports{grid-column:1/-1;color:#d4dce8;font-size:.78rem}
.piece-stat{color:#ffd36a;font-weight:750}
@media(max-width:540px){.card.jigsaw,.unit.jigsaw{padding:14px 16px}.jigsaw .piece-ports{font-size:.7rem}}
:root{color-scheme:dark;--ink:#e9eef2;--muted:#a6b6c4;--gold:#e9c37a;--mint:#8ed7c2;--panel:#121e28;--line:#2e414e}
body{background:radial-gradient(ellipse at 50% 0%,#22342e 0%,#0e171b 40%,#0a1218 100%);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif;min-height:100vh}
.site-header,main{width:min(100%,1170px);padding:12px clamp(10px,3vw,26px)}
.site-header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.site-header h1{color:var(--ink);font-family:Georgia,serif;font-size:clamp(1.6rem,4vw,2.35rem);letter-spacing:.09em;white-space:nowrap}
.site-header h1 span{color:var(--gold)}
.site-header nav{margin:0}
.tab,.battle-actions button{font-weight:650}
button,select,input{font:inherit;color:var(--ink);background:#172630;border-color:#3b5361;min-height:42px}
button:enabled:hover{background:#2b4250}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
button.primary,.active,#end:enabled,#start:enabled{background:var(--gold);color:#161a1a;border-color:var(--gold);font-weight:750}
button.primary:hover,.active:hover,#end:enabled:hover,#start:enabled:hover{background:#f8d994;color:#161a1a}
.panel{background:var(--panel);border-color:var(--line);border-radius:18px;padding:clamp(12px,2.5vw,22px)}
.zone{border-color:var(--line);background:#16242d}
.small,.desc,.meta{color:var(--muted);font-size:.83rem}
.card{background:#1c303b;border-color:#425863}
.card h3{font-size:.9rem}
.card.jigsaw::after,.unit.jigsaw::after{background:#1c303b}
.card.jigsaw.selected::after,.unit.jigsaw.selected::after{background:#31483e}
.lobby{max-width:900px;margin:16px auto}
.lobby h2{margin:0 0 14px}
.lobby-entries{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lobby-option,.invite-share{background:#192c34;border:1px solid #355258;border-radius:14px;padding:16px}

.lobby-option p{margin:0 0 10px;color:var(--muted)}
.lobby-option label,.invite-share label{display:block;font-weight:700}

.invite-share .row,.lobby-option .row{margin-bottom:0}
#inviteInput,#inviteUrl{min-width:0;flex:1}
#inviteUrl{font-size:.85rem;color:var(--mint)}

.arena-heading h2{margin:0;font-size:1.13rem}
#round{background:#263641;border:1px solid #455a67;border-radius:999px;padding:5px 12px;font-size:.84rem}
#round.your-turn{background:#263f37;color:#b0efce;border-color:#547f69}
#leaderRules:empty{display:none}
.battle{grid-template-columns:1fr;gap:0;border:1px solid #3d5660;border-radius:15px;overflow:hidden;margin-top:12px}
.battlefield{display:grid;grid-template-columns:105px minmax(0,1fr);grid-template-areas:"leader cards" "info cards";gap:4px 10px;align-items:center;margin:0;padding:10px 12px;border-radius:0;border:0}
.battlefield.enemy{background:linear-gradient(90deg,#372932,#24333d);border-bottom:1px solid #52606a}

.leader{grid-area:leader;display:flex;align-items:center;justify-content:space-between;gap:4px;background:#131e27;border:1px solid #5b6772;padding:6px 9px;border-radius:9px}

.field-info{grid-area:info;font-size:.72rem}
.board{grid-area:cards;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;min-height:78px;background:repeating-linear-gradient(90deg,transparent 0 32.9%,#ffffff15 33% 33.3%);border-block:1px solid #ffffff18}
.unit{min-width:0;min-height:74px;overflow-wrap:anywhere}
.hand-zone{margin-bottom:0;background:#101b24}
.hand{padding-bottom:5px;scroll-snap-type:x proximity}
.hand .card{scroll-snap-align:start;flex:0 0 175px}
.battle-actions{position:sticky;bottom:0;z-index:3;background:#121f29f5;border:1px solid var(--line);border-radius:11px;padding:8px;margin-bottom:6px}

.battle-actions #end{margin-left:auto}
.battle-help,.log-zone{font-size:.84rem}
.log{height:72px;background:#0d1720}
@media(max-width:630px){
 .site-header{display:block}.site-header nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:5px 0 0}
 .tab{padding:6px 3px;font-size:.75rem;min-height:40px}
 .lobby-entries{grid-template-columns:1fr}
 .arena{padding:8px}
 .battlefield{padding:6px;grid-template-columns:1fr;grid-template-areas:"leader" "cards" "info";gap:3px}
 .leader{justify-self:center;min-width:92px;min-height:34px;padding:1px 7px}
 .leader .hp{font-size:1.2rem}
 .field-info{text-align:center}
 .board{min-height:53px;gap:3px}
 .board .unit{min-height:55px;font-size:.69rem;padding:5px 7px}
 .board .piece-ports{font-size:.57rem}
 .hand-zone{padding:6px;margin-top:7px}
 .hand .card{flex-basis:138px;min-width:138px;min-height:88px;padding:10px}
 .hand .desc,.hand .meta{display:none}
 .hand .card-detail{font-size:.68rem;padding:3px 5px;min-height:30px}
 .battle-actions{gap:4px;padding:5px;bottom:env(safe-area-inset-bottom,0px)}
 .battle-actions button{min-height:36px;padding:4px 6px;font-size:.72rem}
 #cost{flex:1 1 70%;font-size:.75rem}
}
</style>
<header class="site-header"><h1>ROOTS <span>LINK</span></h1>
<nav><button class="tab active" data-to="builder">デッキ編集</button><button class="tab" data-to="catalog">カード図鑑</button><button class="tab" data-to="battle">対戦</button><button class="tab" data-to="online">オンライン対戦</button></nav></header><main>
<section id="builder"><div class="layout"><div class="panel"><h2>カードを選ぶ</h2><div class="tools"><select id="br"><option value="all">全ルーツ</option></select><select id="bt"><option value="all">全種類</option><option value="piece">ピース</option><option value="fusion">融合</option><option value="equipment">装備</option><option value="spell">詠唱</option></select><input id="bs" placeholder="名前・効果を検索"></div><div id="pool" class="cards"></div></div><aside class="panel"><div class="row"><h2>マイデッキ</h2><b id="count">0 / 30</b></div><div class="tools"><button id="fill">ピースでランダム30枚</button><button id="clear">全て外す</button></div><div id="deck" class="decklist"></div><hr><button id="start" disabled>このデッキでCPU対戦！</button><p class="small">30枚ちょうど / 同名カード3枚まで / 同じルーツのみ。融合・装備・詠唱もデッキ30枚に含みます。</p></aside></div></section>
<section id="catalog" class="hidden"><div class="panel"><h2>カード図鑑 <span id="total" class="small">500種</span></h2><div class="tools"><select id="cr"><option value="all">全ルーツ</option></select><select id="ct"><option value="all">全種類</option><option value="piece">ピース</option><option value="fusion">融合</option><option value="equipment">装備</option><option value="spell">詠唱</option></select><input id="cs" placeholder="名前・効果を検索"></div><div id="book" class="cards"></div></div></section>
<section id="battle" class="hidden"><div class="panel arena"><div class="row arena-heading"><h2 id="battleTitle">CPU対戦</h2><button id="again">新しい対戦</button><b id="round">対戦準備中</b></div><p id="leaderRules" class="small"></p><div class="battle"><div class="zone battlefield enemy"><button id="faceTarget" class="leader" type="button" aria-label="相手リーダーを選ぶ"><b id="opponentName">CPU</b><span id="chp" class="hp">20</span></button><div id="cboard" class="board"></div><div id="cinfo" class="small field-info"></div></div><div class="zone battlefield ally"><div class="leader"><b>あなた</b><span id="php" class="hp">20</span></div><div id="pboard" class="board"></div><div id="pinfo" class="small field-info"></div></div></div>
<div class="zone hand-zone"><b>手札</b><div id="hand" class="hand"></div></div>
<div class="tools battle-actions"><b id="cost">召喚 1 / 接続 1</b><button id="summon" disabled>ピース召喚</button><button id="fusion" disabled>融合</button><button id="equip" disabled>装備</button><button id="spell" disabled>詠唱を使う</button><button id="connect" disabled>選択2体を連結</button><button id="attack" disabled>選択ピースで攻撃</button><button id="detach" disabled>装備を外す</button><button id="firework" hidden>火鉢バチを無料召喚</button><button id="patrolReturn" hidden>巡回で手札を戻す</button><button id="end">ターン終了</button></div>
<details class="battle-help"><summary>操作方法</summary><p>手札や盤面のピースを選んでから操作ボタンを押します。連結は自分のピースを2体選択します。相手リーダーを攻撃するときは相手のHP表示を選べます。</p></details>
<details class="zone log-zone" open><summary>バトルログ</summary><div id="log" class="log" aria-live="polite"></div></details></div></section>
<section id="online" class="hidden">
  <div class="panel lobby">
    <h2>オンライン対戦</h2>
    <div class="lobby-entries">
      <div class="lobby-option"><h3>友達を招待</h3><p>部屋を作って、招待リンクを送ります。</p><button id="makeRoom" class="primary">部屋を作る</button></div>
      <div class="lobby-option"><h3>部屋に参加</h3><label for="inviteInput">招待コード</label><div class="row"><input id="inviteInput" placeholder="英数字8文字" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false"><button id="joinRoom">参加</button></div></div>
    </div>
    <div id="inviteShare" class="invite-share" hidden>
      <label for="inviteUrl">招待リンク</label>
      <div class="row"><input id="inviteUrl" readonly><button id="copyInvite" class="primary">リンクをコピー</button><button id="nativeShare" hidden>共有</button></div>
      <small id="copyStatus" aria-live="polite"></small>
    </div>
    <div class="row"><button id="sbConnect" hidden>対戦に戻る</button><span id="sbStatus" class="small" aria-live="polite"></span></div>
    <div id="matchSetup" class="row hidden"><label>ルーツ <select id="matchRoot"></select></label><button id="matchReady" class="primary">固定デッキで参加</button><button id="customReady">マイデッキで参加</button><span id="customStatus" class="small"></span></div>
    <div id="roomStatus" class="small room-status" aria-live="polite"></div>
  </div>
</section>
</main>
<dialog id="cardDialog"><h2 id="detailTitle"></h2><p id="detailStats"></p><p id="detailText"></p><p id="detailEdges" class="piece-ports"></p><form method="dialog"><button>閉じる</button></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
import {cards as C,factions as R,leaderText,prepare,deckFor,applyMove,playCpuTurn} from './supabase/functions/roots-match/rules.js?v=5';
const $=x=>document.getElementById(x),rootName=r=>R.find(x=>x[0]===r)[1],typeName=t=>({piece:'ピース',fusion:'融合',equipment:'装備',spell:'詠唱'}[t]);let deck=[],G=null,handSel=-1,unitSel=-1,targetSel=-1,secondSel=-1;
function esc(s){return String(s).replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))}
function opts(){for(let id of ['br','cr'])R.forEach(([r,n])=>$(id).add(new Option(n,r)))}
function list(root,type,q){return C.filter(c=>(root==='all'||c.r===root)&&(type==='all'||c.t===type)&&(!q||(c.n+c.d+c.k).includes(q)))}
const pieceColors={red:'#d97876',blue:'#70afd8',green:'#86bc91',white:'#e8dba4',black:'#aa8eca'};
function shapeStyle(piece){
  const edges=piece.edges??piece.e;
  if(!Array.isArray(edges)||edges.length!==4)return '';
  const border=[];
  const transform=[
    (x,y)=>[x,y],(x,y)=>[100-y,x],(x,y)=>[100-x,100-y],(x,y)=>[y,100-x],
  ];
  for(let side=0;side<4;side++){
    const drop=edges[side].s==='凸'?1:edges[side].s==='凹'?13:7;
    for(const [x,y] of [[7,7],[39,7],[41,drop],[45,drop],[55,drop],[59,drop],[61,7],[93,7]]){
      border.push(transform[side](x,y).map(n=>n+'%').join(' '));
    }
  }
  return '--piece-shape:polygon('+border.join(',')+');--root-color:'+(pieceColors[piece.r]??'#8293b1');
}
function edgeLabels(edges){
  if(!Array.isArray(edges)||!edges.length)return '';
  return edges.map((edge,i)=>['↑','→','↓','←'][i]+
    (edge.s==='無'?'—':edge.s==='凸'?'凸'+edge.c:'凹')+(edge.used?'済':'')).join(' ');
}
function card(c){
  const frame=shapeStyle(c);
  const stats=c.t==='piece'?'召喚 '+c.c:c.t==='fusion'?'一体化 '+c.cc:typeName(c.t);
  return `<article class="card ${frame?'jigsaw':''}" style="${frame}" data-id="${c.id}">
    <h3>${rootName(c.r)} ${esc(c.n)}</h3><button type="button" class="card-detail" data-detail="${c.id}">詳細</button>
    <div class="stats">${stats}${c.t==='piece'||c.t==='fusion'?`　⚔${c.a} ♥${c.h}`:''}</div>
    <p class="desc">${esc(c.d)}</p><div class="piece-ports">${edgeLabels(c.e)}</div></article>`;
}
function renderPool(){let a=list($('br').value,$('bt').value,$('bs').value);$('pool').innerHTML=a.map(card).join('')}
function renderBook(){let a=list($('cr').value,$('ct').value,$('cs').value);$('book').innerHTML=a.map(card).join('');$('total').textContent=a.length+'種表示 / 全'+C.length+'種'}
const deckStorageKey='roots-link.deck.v1';
try {
  const saved=JSON.parse(localStorage.getItem(deckStorageKey));
  if(Array.isArray(saved)){
    for(const id of saved.slice(0,30)){
      const card=C.find(entry=>entry.id===id);
      if(card&&(!deck.length||C.find(entry=>entry.id===deck[0]).r===card.r)&&deck.filter(value=>C.find(entry=>entry.id===value).n===card.n).length<3)deck.push(id);
    }
  }
} catch {}
function deckCanPlay(){
  return deck.length===30&&deck.some(id=>C.find(card=>card.id===id).t==='piece');
}
function renderDeck(){try{localStorage.setItem(deckStorageKey,JSON.stringify(deck))}catch{}$('count').textContent=deck.length+' / 30';$('start').disabled=!deckCanPlay();$('deck').innerHTML=deck.map((id,i)=>{let c=C.find(x=>x.id===id);return `<div class="item">${rootName(c.r)} ${esc(c.n)} <button data-del="${i}">外す</button></div>`}).join('')||'<p class="small">カードを追加してね。</p>'}
function add(id){let c=C.find(x=>x.id===id);if(!c)return;if(deck.length&&C.find(x=>x.id===deck[0]).r!==c.r)return alert('デッキには同じルーツのカードだけを入れられます。');if(deck.length>=30)return alert('30枚まで！');if(deck.filter(x=>C.find(y=>y.id===x).n===c.n).length>=3)return alert('同名カードは3枚まで！');deck.push(id);renderDeck()}
function randDeck(root=R[Math.floor(Math.random()*R.length)][0]){let p=C.filter(c=>c.t==='piece'&&c.r===root),d=[];while(d.length<30){let c=p[Math.random()*p.length|0];if(d.filter(x=>C.find(y=>y.id===x).n===c.n).length<3)d.push(c.id)}return d}
function show(id){document.body.classList.toggle('playing',id==='battle'&&!!G);document.querySelectorAll('main>section').forEach(s=>s.classList.toggle('hidden',s.id!==id));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.to===id))}
function log(s){G.logs.unshift(s);$('log').innerHTML=G.logs.map(esc).join('<br>')}
let cpuMatch=null;
function renderCpuMatch(){
  const {host,guest,round,turn,winner,logs}=cpuMatch;
  G={p:{...host,capacity:Math.min(5,host.capacity+(host.activated?1:0))},
    c:guest,round,turn:turn==='host'?'p':'c',over:!!winner,won:winner==='host',logs:[...logs]};
  handSel=unitSel=targetSel=secondSel=-1;
  $('log').innerHTML=logs.map(esc).join('<br>');
  renderGame();
}
function startGame(){
  if(!deckCanPlay())return;
  window.closeOnlineMatch?.();
  const rival=R[Math.floor(Math.random()*R.length)][0];
  cpuMatch={host:prepare(deck,true),guest:prepare(deckFor(rival),false),
    round:1,turn:'host',winner:null,logs:['対戦開始。あなたが先攻です。']};
  renderCpuMatch();
  show('battle');
}
function cpuMove(action){
  if(!cpuMatch||cpuMatch.winner||cpuMatch.turn!=='host')return;
  try{
    cpuMatch=applyMove(cpuMatch,'host',action);
    renderCpuMatch();
    if(cpuMatch.turn==='guest'&&!cpuMatch.winner){
      const current=cpuMatch;
      setTimeout(()=>{
        if(cpuMatch!==current||G?.online)return;
        cpuMatch=playCpuTurn(current);
        renderCpuMatch();
      },420);
    }
  }catch(error){$('log').textContent=error.message;}
}

ck').disabled=!own||unitSel<0||!p.b[unitSel]?.ready;$('detach').disabled=!own||unitSel<0||!p.b[unitSel]?.equip;$('end').disabled=!own;$('patrolReturn').hidden=!G.p.pending||G.turn!=='p'||G.over;$('patrolReturn').disabled=handSel<0;$('firework').hidden=!G.p.freeFirework||!own;$('firework').disabled=G.p.h[handSel]!=='redp1';$('faceTarget').disabled=G.over;$('again').hidden=!!G.online}

(()=>{
 const $=id=>document.getElementById(id); let client=null, roomTimer=null, roomRequest=0;
 const status=(msg,ok=false)=>{ $('sbStatus').textContent=msg; $('sbStatus').className=ok?'small good':'small warn'; };
 const u="https://akelbvwqbvlkjjufpoiw.supabase.co", k="sb_publishable_L7ZMaQ-jRMXbRsha3QdAgw_eaPmglQg";
 let connection=null;
 function storedRoom(){
   try{return JSON.parse(sessionStorage.getItem('roots-link.room'));}catch{return null;}
 }
 async function connectOnline(){
   if(connection)return connection;
   connection=(async()=>{
     if(!window.supabase?.createClient)throw new Error('通信機能を読み込めません。ページを再読み込みしてください。');
     client??=window.supabase.createClient(u,k,{auth:{storage:sessionStorage}});
     status('接続中…');
     const current=await client.auth.getSession();
     if(current.error)throw current.error;
     if(!current.data.session){
       const response=await client.auth.signInAnonymously();
       if(response.error)throw response.error;
     }
     status('接続済み',true);
   })();
   try{await connection;}catch(error){connection=null;throw error;}
 }
 async function resumeRoom(){
   const saved=storedRoom();
   if(!saved?.room)return;
   try{await connectOnline();showRoom(saved.room,saved.host);}
   catch(error){matchError(error.message);}
 }
 $('sbConnect').hidden=!storedRoom()?.room;
 $('sbConnect').onclick=resumeRoom;
 let matchRoom=null, matchVersion=null, matchTimer=null, movePending=false, matchGeneration=0, queuedAction=null, posting=false;
 for(const [root,name] of R) $('matchRoot').add(new Option(name,root));
 window.closeOnlineMatch=()=>{
   matchGeneration++;
   queuedAction=null;
   clearTimeout(matchTimer);
   matchRoom=null;
   clearTimeout(roomTimer);
   try { sessionStorage.removeItem('roots-link.room'); } catch {}
   $('matchSetup').classList.add('hidden');

 function matchError(message) {
   $('roomStatus').textContent=message;
   if(G?.online) $('log').textContent=message;
 }
 async function matchUpdate(action) {
   let refreshReady=false;
   if(!matchRoom)return;
   if(movePending){
     if(action&&!posting&&!queuedAction)queuedAction={action,version:matchVersion};
     return;
   }
   movePending=true;
   posting=!!action;
   const generation=matchGeneration;
   clearTimeout(matchTimer);
   try {
     const reply=await client.functions.invoke('roots-match',{body:{room:matchRoom,revision:matchVersion,action}});
     if(generation!==matchGeneration)return;
     if(reply.error){
       if(reply.error.context?.status===409&&action?.kind==='ready'&&!action.retry){
         queuedAction={action:{...action,retry:true},version:matchVersion};
         refreshReady=true;
         return;
       }
       const details=await reply.error.context?.json?.().catch(()=>null);
       throw new Error(details?.error||reply.error.message);
     }
     const match=reply.data;
     const updated=matchVersion!==match.version;
     matchVersion=match.version;
     $('matchSetup').classList.toggle('hidden',!!match.p);
     $('customReady').disabled=!deckCanPlay();
     $('customStatus').textContent=deckCanPlay()?rootName(C.find(card=>card.id===deck[0]).r)+' · 30枚':'デッキ編集で同じルーツの30枚を用意してください。';
     $('roomStatus').textContent=match.ready?'対戦中':match.p?'相手のデッキ決定を待っています。':'ルーツを選んで対戦を始めます。';
     if(match.ready&&(updated||!G?.online)){
       const first=!G?.online;
       G={...match,online:true};
       handSel=unitSel=targetSel=secondSel=-1;
       $('log').innerHTML=G.logs.map(esc).join('<br>');
       renderGame();
       if(first)show('battle');
     }
   } catch(error) {
     if(generation===matchGeneration)matchError(error.message);
   } finally {
     movePending=false;
     posting=false;
     if(refreshReady&&generation===matchGeneration){
       matchUpdate();
       return;
     }
     const pending=queuedAction;
     queuedAction=null;
     if(pending&&(pending.version===matchVersion||pending.action.kind==='ready'))matchUpdate(pending.action);
     else if(matchRoom&&!G?.over)matchTimer=setTimeout(()=>matchUpdate(),1600);
   }
 }
 $('customReady').onclick=()=>{if(deckCanPlay())matchUpdate({kind:'ready',deck:[...deck]})};

 function move(kind) {
   const action={kind,hand:handSel,unit:unitSel,second:secondSel,target:targetSel};
   if(G?.online)matchUpdate(action);

 }
 for(const [id,kind] of [
   ['summon','summon'],['fusion','fuse'],['connect','connect'],

 function showRoom(room, host) {
   clearTimeout(roomTimer);
   try { sessionStorage.setItem('roots-link.room',JSON.stringify({room,host})); } catch {}
   const request = roomRequest;
   const output = $('roomStatus');
   $('inviteInput').value = room.invite_code;
   $('sbConnect').hidden=true;
   if(location.hash!=='#online')history.replaceState(null,'',location.pathname+location.search+'#online');
   $('inviteShare').hidden=!host||room.status==='playing';
   if(host&&room.status==='waiting'){
     const link=new URL(location.href);
     link.search='';
     link.hash='';
     link.searchParams.set('join',room.invite_code);
     $('inviteUrl').value=link.href;
     $('nativeShare').hidden=typeof navigator.share!=='function';
   }
   if (room.status === 'playing') {
     output.textContent = '2人がそろいました。';
     matchGeneration++;
     matchRoom=room.room_id;
     matchVersion=null;
     if(G?.online)G=null;
     matchUpdate();
     return;
   }
   output.textContent = '相手を待っています。招待コード：' + room.invite_code;
   roomTimer = setTimeout(async () => {
     try {
       const {data, error} = await client.from('rooms').select('invite_code,status')
         .eq('id', room.room_id).single();
       if (request !== roomRequest) return;
       if (error) throw error;
       showRoom({...room, ...data}, host);
     } catch {
       if (request !== roomRequest) return;
       output.textContent = '部屋の状態を取得できません。招待コード：' + room.invite_code;
     }
   }, 2000);
 }

 async function enterRoom(host) {
   const code = $('inviteInput').value.trim();
   const output = $('roomStatus');
   if (!host && !/^[a-f0-9]{8}$/i.test(code)) {

   }
   clearTimeout(roomTimer);

   window.closeOnlineMatch();

   $('copyStatus').textContent='';
   output.textContent = host ? '部屋を作成中…' : '参加中…';
   try {

     const result = host ? await client.rpc('create_room')
       : await client.rpc('join_room', {p_invite_code: code});
     if (result.error) throw result.error;
     showRoom(result.data, host);
     if(!host&&new URL(location.href).searchParams.has('join')){
       const clean=new URL(location.href);

       history.replaceState(null,'',clean);
     }
   } catch (error) {
     output.textContent = (host ? '部屋作成エラー：' : '参加エラー：') + error.message;
   } finally {
     $('makeRoom').disabled = $('joinRoom').disabled = false;
   }
